name: Deploy taisk to GitHub Pages

on:
  push:
    branches: [ claude/task-management-app-gafa5q ]
    paths:
      - 'taisk-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload taisk-app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: taisk-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
