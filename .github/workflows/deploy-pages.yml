name: Deploy taisk to GitHub Pages

on:
  push:
    branches: [ claude/task-management-app-gafa5q ]
    paths:
      - 'taisk-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Browsers/CDNs cache styles.css and app.js aggressively, so a plain
      # redeploy at the same URL can keep serving an old version. Tagging
      # both with the commit SHA gives every deploy a distinct asset URL,
      # forcing a fresh fetch without needing a manual hard refresh.
      - name: Cache-bust local assets
        run: |
          sed -i "s/styles\.css\"/styles.css?v=${GITHUB_SHA}\"/" taisk-app/index.html
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA}\"/" taisk-app/index.html

      - name: Upload taisk-app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: taisk-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
