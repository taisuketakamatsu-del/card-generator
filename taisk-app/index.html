<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>taisk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 32 32" fill="none">
        <defs>
          <linearGradient id="logoGrad" x1="4" y1="2" x2="26" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect x="13" y="2" width="14" height="17" rx="4.5" transform="rotate(20 13 2)" fill="url(#logoGrad)"/>
        <rect x="3" y="14" width="13" height="16" rx="4.5" transform="rotate(20 3 14)" fill="url(#logoGrad)" opacity="0.88"/>
      </svg>
      <span>t&thinsp;a&thinsp;i&thinsp;s&thinsp;k</span>
    </div>

    <div class="topbar-right">
      <div class="presence-stack" id="presenceStack" title="今見ている人"></div>

      <nav class="tab-bar" id="tabBar">
        <button type="button" class="tab-btn active" data-tab="shared">仕事</button>
        <button type="button" class="tab-btn" data-tab="completed">完了済み</button>
      </nav>

      <button type="button" class="private-toggle-btn icon-only" id="privateToggleBtn" title="プライベート">
        <svg class="icon-lock" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <svg class="icon-back" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span id="privateToggleLabel" class="sr-only">プライベート</span>
      </button>

      <button class="btn-share" id="shareBtn" title="タスクを共有">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span>共有</span>
      </button>
      <button class="btn-add" id="addBtn" title="タスクを追加">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- ---------- Shared board ---------- -->
  <div class="view active" id="sharedView">
    <section class="now-section">
      <div class="section-title">
        <span>いまやる</span>
        <span class="badge" id="nowCount">0</span>
      </div>
      <div class="now-list" id="nowList"></div>
    </section>

    <section class="board" id="board">
      <!-- columns injected by app.js -->
    </section>
  </div>

  <!-- ---------- Completed tasks (kept ~30 days, restorable) ---------- -->
  <div class="view" id="completedView">
    <div class="section-title"><span>完了済み</span><span class="badge" id="completedCount">0</span></div>
    <p class="modal-sub" style="margin:-4px 0 14px;">完了してから30日間、ここに残ります。「復元」でいつでも戻せます。</p>
    <div class="completed-list" id="completedList"></div>
  </div>

  <!-- ---------- Private board ---------- -->
  <div class="view private-theme" id="privateView">
    <div class="private-locked" id="privateLocked">
      <div class="lock-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h3>プライベートタスク</h3>
      <p>ここはあなただけのタスク置き場です。パスコードを入力してください。</p>

      <input id="privatePasswordInput" class="text-input" type="password" placeholder="パスコード" autocomplete="current-password" />

      <button class="btn-primary" id="privateUnlockBtn">開く</button>
      <button type="button" class="link-btn" id="privateResetBtn">パスコードを忘れた場合はリセット</button>
      <p class="private-error" id="privateError"></p>
    </div>

    <div class="private-content" id="privateContent" style="display:none;">
      <nav class="sub-tab-bar" id="privateSubTabBar">
        <button type="button" class="sub-tab-btn active" data-subtab="board">タスク</button>
        <button type="button" class="sub-tab-btn" data-subtab="completed">完了済み</button>
      </nav>

      <div class="sub-view active" id="privateBoardWrap">
        <section class="now-section">
          <div class="section-title">
            <span>いまやる</span>
            <span class="badge" id="nowCountPriv">0</span>
          </div>
          <div class="now-list" id="nowListPriv"></div>
        </section>

        <section class="board" id="boardPriv">
          <!-- columns injected by app.js -->
        </section>
      </div>

      <div class="sub-view" id="privateCompletedWrap">
        <div class="section-title"><span>完了済み</span><span class="badge" id="completedCountPriv">0</span></div>
        <p class="modal-sub" style="margin:-4px 0 14px;">仕事側とは別に、プライベートだけの完了記録です。30日間残ります。</p>
        <div class="completed-list" id="completedListPriv"></div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span>やることで、進む。</span>
    <span>More life, less tasks.</span>
  </footer>

</div>

<!-- Nickname registration (required before using the app) -->
<div class="modal-overlay" id="nicknameOverlay">
  <div class="modal">
    <h3>ようこそ taisk へ</h3>
    <p class="modal-sub">今このアプリを見ている人が分かるように、ニックネームを登録してください。</p>
    <label class="field-label">ニックネーム</label>
    <input id="nicknameInput" class="text-input" placeholder="例: たかまつ" maxlength="24" />
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn-primary" id="nicknameSaveBtn">はじめる</button>
    </div>
  </div>
</div>

<!-- Share link -->
<div class="modal-overlay" id="shareOverlay">
  <div class="modal">
    <h3>このリンクを共有</h3>
    <p class="modal-sub">同じリンクを開けば、同じタスクをみんなで見られます。</p>
    <div class="share-link-row">
      <input id="shareLinkInput" class="text-input" readonly />
      <button class="btn-primary" id="shareCopyBtn">コピー</button>
    </div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn-ghost" id="shareCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<!-- Add / edit task -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">新しいタスク</h3>

    <label class="field-label" id="taskTitleLabel">タスク名</label>
    <input id="taskTitleInput" class="text-input" placeholder="タスク名を入力" maxlength="120" />
    <textarea id="taskBulkInput" class="text-input" placeholder="1行に1つずつタスク名を貼り付け" rows="6" style="display:none; resize:vertical;"></textarea>
    <button type="button" class="link-btn" id="bulkModeToggle" style="margin-top:6px;">複数行でまとめて追加</button>

    <label class="field-label">期限</label>
    <div class="bucket-picker" id="bucketPicker">
      <button type="button" class="bucket-opt" data-bucket="week"><span class="dot dot-week"></span>今週</button>
      <button type="button" class="bucket-opt" data-bucket="month"><span class="dot dot-month"></span>今月</button>
      <button type="button" class="bucket-opt" data-bucket="later"><span class="dot dot-later"></span>それ以降</button>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="pinCheckbox" />
      <span>いまやるに追加する</span>
    </label>

    <div class="modal-actions">
      <button class="btn-ghost" id="deleteBtn" style="display:none;">削除</button>
      <div class="spacer"></div>
      <button class="btn-ghost" id="cancelBtn">キャンセル</button>
      <button class="btn-primary" id="saveBtn">追加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
